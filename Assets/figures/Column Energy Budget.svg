<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="760" height="470" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="380.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Energy budget of one latitude belt</text>
<line x1="380.0" y1="141.0" x2="380.0" y2="209.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="390.0" y="169.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">R_TOA</text>
<line x1="191.0" y1="275.0" x2="244.0" y2="275.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="227.5" y="269.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="516.0" y1="275.0" x2="569.0" y2="275.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="552.5" y="269.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">−</text>
<rect x="190.0" y="65.0" width="380" height="70" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="95.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Space</text>
<text x="380" y="115.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">absorbed sunlight in  ·  OLR out</text>
<rect x="250.0" y="215.0" width="260" height="120" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Atmosphere–ocean column</text>
<text x="380" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">energy content E</text>
<text x="380" y="300.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">dE/dt = R_TOA − ΔF</text>
<rect x="15.0" y="233.0" width="170" height="84" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="100" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Flux in</text>
<text x="100" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">F(φ−)</text>
<text x="100" y="300.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">from the equator side</text>
<rect x="575.0" y="233.0" width="170" height="84" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="660" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Flux out</text>
<text x="660" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">F(φ+)</text>
<text x="660" y="300.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">towards the pole</text>
<text x="380.0" y="452" text-anchor="middle" font-size="13" fill="#52514e">Annual mean: dE/dt ≈ 0, so R_TOA = ΔF = F(φ+) − F(φ−): the belt exports its net radiative surplus poleward</text>
</svg>