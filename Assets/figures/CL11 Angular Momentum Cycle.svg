<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 590" width="860" height="590" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="860" height="590" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="430.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Angular-momentum cycle: picked up in the tropics, dropped in the mid-latitudes</text>
<line x1="370.8" y1="457.1" x2="251.6" y2="390.9" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="301.2" y="418.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+AM</text>
<line x1="188.9" y1="286.7" x2="230.4" y2="210.3" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="219.7" y="242.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">ascent</text>
<line x1="380.9" y1="145.5" x2="484.1" y2="129.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="638.7" y1="149.9" x2="669.1" y2="192.1" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="696.7" y1="279.0" x2="694.0" y2="316.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="580.6" y1="420.5" x2="500.4" y2="457.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="530.5" y="433.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">−AM</text>
<rect x="110.0" y="460.0" width="640" height="60" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="430" y="495.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Solid Earth: a huge reservoir of angular momentum (AM)</text>
<rect x="10.0" y="292.0" width="300" height="96" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="160" y="325.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Tropical surface: easterlies</text>
<text x="160" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">ground runs east faster than air</text>
<text x="160" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">→ air gains westerly AM</text>
<rect x="135.0" y="125.0" width="240" height="80" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="255" y="150.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Hadley cell, upper branch</text>
<text x="255" y="170.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">mean flow carries AM</text>
<text x="255" y="190.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">upward and poleward</text>
<rect x="490.0" y="75.0" width="240" height="70" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="610" y="95.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Subtropical jet</text>
<text x="610" y="115.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">largest westerlies</text>
<text x="610" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(AM turned to the right)</text>
<rect x="575.0" y="197.0" width="250" height="76" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="230.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Mid-latitude eddies carry</text>
<text x="700" y="250.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">AM poleward and downward</text>
<rect x="535.0" y="322.0" width="310" height="96" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="690" y="355.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Mid-latitude surface: westerlies</text>
<text x="690" y="375.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">air runs east faster than ground</text>
<text x="690" y="395.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">→ air loses AM to the Earth</text>
<text x="430.0" y="572" text-anchor="middle" font-size="13" fill="#52514e">In steady state the net torque of the Earth on the atmosphere is zero (otherwise the length of the day would drift)</text>
</svg>