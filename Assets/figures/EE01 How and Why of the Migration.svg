<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="860" height="610" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="430.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Two kinds of question about one behaviour: proximate (how) and ultimate (why)</text>
<line x1="245.9" y1="189.9" x2="329.7" y2="235.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="286.0" y1="290.0" x2="329.0" y2="290.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="614.1" y1="189.9" x2="530.3" y2="235.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="574.0" y1="290.0" x2="531.0" y2="290.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="430.0" y1="348.0" x2="430.0" y2="407.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="10.0" y="83.0" width="270" height="104" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="145" y="110.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">HOW (mechanism)</text>
<text x="145" y="130.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">muscles 62.6 % efficient;</text>
<text x="145" y="150.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">movement tracks green-grass intake</text>
<text x="145" y="170.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">and plant nitrogen (Holdo 2009)</text>
<rect x="10.0" y="238.0" width="270" height="104" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="145" y="275.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">HOW (reproduction)</text>
<text x="145" y="295.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">calves stand in ~6 min;</text>
<text x="145" y="315.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">rut and calving are synchronous</text>
<rect x="335.0" y="238.0" width="190" height="104" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="430" y="275.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">OBSERVED</text>
<text x="430" y="295.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">~1.2 million animals</text>
<text x="430" y="315.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">walk ~1,500 km a year</text>
<rect x="580.0" y="83.0" width="270" height="104" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="715" y="110.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">WHY (benefit)</text>
<text x="715" y="130.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">rainfall and soil fertility</text>
<text x="715" y="150.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">run in opposite directions:</text>
<text x="715" y="170.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">&gt;3,500 km² of rich grass</text>
<rect x="580.0" y="238.0" width="270" height="104" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="715" y="265.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">WHY (benefit)</text>
<text x="715" y="285.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">synchronous calving swamps</text>
<text x="715" y="305.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">predators; migration escapes</text>
<text x="715" y="325.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">local food limits</text>
<rect x="195.0" y="413.0" width="470" height="84" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="430" y="440.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">CONSEQUENCES FOR THE ECOSYSTEM</text>
<text x="430" y="460.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">mass drownings feed the Mara River (death);</text>
<text x="430" y="480.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">grazing changes fuel and fire</text>
<text x="430.0" y="592" text-anchor="middle" font-size="13" fill="#52514e">Mayr&#x27;s distinction: proximate = how the machinery works now; ultimate = why selection built it that way</text>
</svg>