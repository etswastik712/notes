<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="760" height="540" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="380.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Ice–albedo feedback: each link strengthens the cooling (f_α &gt; 0)</text>
<line x1="434.6" y1="145.3" x2="565.4" y2="229.7" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="510.0" y="181.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="561.9" y1="300.1" x2="438.1" y2="374.9" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="490.0" y="331.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="321.9" y1="374.9" x2="198.1" y2="300.1" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="250.0" y="331.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="194.6" y1="229.7" x2="325.4" y2="145.3" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="270.0" y="181.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<rect x="265.0" y="78.0" width="230" height="64" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="105.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Temperature falls</text>
<text x="380" y="125.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T ↓</text>
<rect x="505.0" y="233.0" width="230" height="64" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="620" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">More snow and ice</text>
<text x="620" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">ice cover ↑</text>
<rect x="265.0" y="378.0" width="230" height="64" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="405.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Albedo rises</text>
<text x="380" y="425.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">α ↑</text>
<rect x="25.0" y="233.0" width="230" height="64" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="140" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Less sunlight absorbed</text>
<text x="140" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">S(1−α)/4 ↓</text>
<rect x="255.0" y="213.0" width="250" height="104" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="250.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Planck response</text>
<text x="380" y="270.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">colder → σT⁴ falls</text>
<text x="380" y="290.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">→ restoring (negative)</text>
<text x="380.0" y="522" text-anchor="middle" font-size="13" fill="#52514e">Net effect on the response:  Λ = Λ_P / (1 − f_α):  larger than the no-feedback Planck response Λ_P</text>
</svg>