<text x="330" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Madelung energy</text>
<text x="330" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">large HOMO-LUMO gap</text>
<rect x="540.0" y="275.0" width="320" height="110" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
