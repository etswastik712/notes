<text x="830" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">SCN-: N to hard, S to soft</text>
<text x="830" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">AgI2- ok, AgF2- not</text>
<text x="830" y="545.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">metathesis direction</text>
<text x="500.0" y="652" text-anchor="middle" font-size="13" fill="#52514e">CH-2113 slides 78-89; Tutorial 3; Pearson 1988</text>
