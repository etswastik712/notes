<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1000" height="630" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">GT09: transfer and normal p-complements in one page</text>
<line x1="321.0" y1="130.0" x2="349.0" y2="130.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="651.0" y1="130.0" x2="679.0" y2="130.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="778.4" y1="184.3" x2="696.4" y2="270.7" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="421.0" y1="330.0" x2="469.0" y2="330.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="515.4" y1="387.5" x2="363.8" y2="457.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="643.4" y1="391.0" x2="646.9" y2="454.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="25.0" y="80.0" width="290" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Subgroup H, index n</text>
<text x="170" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">transversal t_1..t_n</text>
<text x="170" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">h_i(g) = t_i g t_(i.g)^-1</text>
<rect x="355.0" y="80.0" width="290" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Transfer V: G -&gt; H/H&#x27;</text>
<text x="500" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">homomorphism, independent</text>
<text x="500" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">of the transversal</text>
<rect x="685.0" y="80.0" width="290" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Cycle formula</text>
<text x="830" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">V(g) = prod t g^f t^-1</text>
<text x="830" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(f = cycle lengths)</text>
<rect x="85.0" y="275.0" width="330" height="110" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="250" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Burnside fusion lemma</text>
<text x="250" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">P abelian Sylow: conjugacy of</text>
<text x="250" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">elements of P happens in N_G(P)</text>
<rect x="475.0" y="275.0" width="330" height="110" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="640" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Burnside&#x27;s theorem</text>
<text x="640" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">P in Z(N_G(P)) =&gt; V(x) = x^n on P</text>
<text x="640" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">=&gt; normal p-complement ker V</text>
<rect x="85.0" y="460.0" width="330" height="100" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="250" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Cayley: cyclic Sylow 2</text>
<text x="250" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">regular rep is odd =&gt; index 2</text>
<rect x="480.0" y="460.0" width="340" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="650" y="495.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Smallest prime p, cyclic P</text>
<text x="650" y="515.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">=&gt; normal p-complement</text>
<text x="650" y="535.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(order pq, 30, 385, ...)</text>
<text x="500.0" y="612" text-anchor="middle" font-size="13" fill="#52514e">Kurzweil-Stellmacher ch. 7; own proofs</text>
</svg>