<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1000" height="670" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">QM07: the finite square well in one page</text>
<line x1="316.0" y1="140.0" x2="354.0" y2="140.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="646.0" y1="140.0" x2="679.0" y2="140.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="679.2" y1="183.4" x2="315.8" y2="288.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="316.0" y1="330.0" x2="349.0" y2="330.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="830.0" y1="196.0" x2="830.0" y2="269.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="193.4" y1="195.5" x2="304.5" y2="459.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="501.0" y1="520.0" x2="529.0" y2="520.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="679.0" y1="330.0" x2="651.0" y2="330.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="30.0" y="90.0" width="280" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="125.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">The well</text>
<text x="170" y="145.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">V = 0 for |x| &lt; a, V0 outside</text>
<text x="170" y="165.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">energy from the floor, 0 &lt; E &lt; V0</text>
<rect x="360.0" y="90.0" width="280" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="125.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Match psi and psi&#x27; at x = a</text>
<text x="500" y="145.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">parity: even cos, odd sin</text>
<text x="500" y="165.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">outside: exp(-kappa|x|)</text>
<rect x="685.0" y="90.0" width="290" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="125.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Quantisation</text>
<text x="830" y="145.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">kappa/k0 = tan(k0 a)  (even)</text>
<text x="830" y="165.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">kappa/k0 = -cot(k0 a)  (odd)</text>
<rect x="30.0" y="275.0" width="280" height="110" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="305.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Graph (Tutorial IV)</text>
<text x="170" y="325.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">kappa/k0 = sqrt(z0^2/z^2 - 1)</text>
<text x="170" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">intersect tan / -cot branches</text>
<text x="170" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">N = ceil(2 z0/pi)</text>
<rect x="355.0" y="275.0" width="290" height="110" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="305.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Limits</text>
<text x="500" y="325.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">deep: box, E (1 - 2/z0)</text>
<text x="500" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">shallow: always one state</text>
<text x="500" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">delta: kappa = m alpha/hbar^2</text>
<rect x="685.0" y="275.0" width="290" height="110" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="305.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Penetration</text>
<text x="830" y="325.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">d = 1/kappa, P_out &gt; 0</text>
<text x="830" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">wider effective box,</text>
<text x="830" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">levels below the box levels</text>
<rect x="165.0" y="465.0" width="330" height="110" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="330" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">E &gt; V0: scattering</text>
<text x="330" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">A e^{ikx} + B e^{-ikx} ... F e^{ikx}</text>
<text x="330" y="545.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T = 1/(1 + V0^2 sin^2(2 k0 a)/4E(E-V0))</text>
<rect x="535.0" y="465.0" width="330" height="110" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="495.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Resonances</text>
<text x="700" y="515.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T = 1 at 2 k0 a = n pi</text>
<text x="700" y="535.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(box energies); T -&gt; 0 at E = V0</text>
<text x="700" y="555.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T + R = 1</text>
<text x="500.0" y="652" text-anchor="middle" font-size="13" fill="#52514e">Finite_well.pdf pp.2-13 (instructor), Tutorial IV; Griffiths 2.6, Sakurai 2.5 for the extras</text>
</svg>