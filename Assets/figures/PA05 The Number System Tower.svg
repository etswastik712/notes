<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="980" height="490" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="490.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Each system is built from the previous one by equivalence classes or cuts</text>
<line x1="221.0" y1="240.0" x2="279.0" y2="240.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="260.0" y="234.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">add negatives</text>
<line x1="461.0" y1="240.0" x2="519.0" y2="240.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="500.0" y="234.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">add quotients</text>
<line x1="701.0" y1="240.0" x2="759.0" y2="240.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="740.0" y="234.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">fill the gaps</text>
<rect x="45.0" y="190.0" width="170" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="130" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">N</text>
<text x="130" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">von Neumann sets</text>
<text x="130" y="265.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">0 = {}, n+1 = n u {n}</text>
<rect x="285.0" y="190.0" width="170" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="370" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Z</text>
<text x="370" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">classes of pairs (a, b)</text>
<text x="370" y="265.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(a,b) ~ (c,d) iff a+d = c+b</text>
<rect x="525.0" y="190.0" width="170" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="610" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Q</text>
<text x="610" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">classes of pairs (a, b), b != 0</text>
<text x="610" y="265.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">ad = bc</text>
<rect x="765.0" y="190.0" width="170" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="850" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">R</text>
<text x="850" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Dedekind cuts of Q</text>
<text x="850" y="265.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">least upper bound property</text>
<text x="490.0" y="472" text-anchor="middle" font-size="13" fill="#52514e">AI notes ch. 12-15 (extra, book level); Assignment 8 uses only the induction property of N</text>
</svg>