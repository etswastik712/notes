<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="940" height="590" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="940" height="590" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="470.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Quantum mechanics in one pass: state, operator, eigenbasis, probabilities</text>
<line x1="311.0" y1="150.0" x2="674.0" y2="150.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="310.8" y1="298.2" x2="339.2" y2="289.8" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="640.7" y1="198.8" x2="674.3" y2="188.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="800.0" y1="204.0" x2="800.0" y2="279.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="293.7" y1="390.3" x2="381.1" y2="425.7" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="35.0" y="102.0" width="270" height="96" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="135.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">State</text>
<text x="170" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">psi(x), or |psi&gt;</text>
<text x="170" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">normalised: sum |c|^2 = 1</text>
<rect x="35.0" y="292.0" width="270" height="96" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="325.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Observable A</text>
<text x="170" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">represented by an</text>
<text x="170" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Hermitian operator A-hat</text>
<rect x="345.0" y="190.0" width="290" height="110" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="490" y="220.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Eigenproblem</text>
<text x="490" y="240.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">A-hat phi_a = a phi_a</text>
<text x="490" y="260.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">eigenvalues a: possible results</text>
<text x="490" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">eigenstates phi_a: a basis</text>
<rect x="680.0" y="102.0" width="240" height="96" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="800" y="135.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Expansion</text>
<text x="800" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">psi = sum c_a phi_a</text>
<text x="800" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">c_a = &lt;phi_a|psi&gt;</text>
<rect x="680.0" y="285.0" width="240" height="110" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="800" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Outcomes</text>
<text x="800" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">P(a) = |c_a|^2</text>
<text x="800" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">&lt;A&gt; = sum |c_a|^2 a</text>
<text x="800" y="375.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(DA)^2 = &lt;A^2&gt; - &lt;A&gt;^2</text>
<rect x="230.0" y="428.0" width="520" height="84" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="490" y="465.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">[A,B] = 0: shared eigenstates, both sharp</text>
<text x="490" y="485.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">[A,B] != 0: DA DB &gt;= |&lt;[A,B]&gt;|/2   (x,p: hbar/2)</text>
<text x="470.0" y="572" text-anchor="middle" font-size="13" fill="#52514e">PH2113 States, Operators, Measurements: Sections 2-8 and 11; the commutator decides which observables can be sharp together</text>
</svg>