<text x="150" y="435.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">shape, bond, energy levels</text>
<text x="490.0" y="572" text-anchor="middle" font-size="13" fill="#52514e">CH-2113 slides 1-52: VSEPR (1-7), valence bond and hybridisation (8-26), molecular orbitals (27-52)</text>
