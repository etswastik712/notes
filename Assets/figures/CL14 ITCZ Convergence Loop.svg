<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 590" width="860" height="590" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="860" height="590" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="430.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">The ITCZ: trade-wind convergence feeds ascent, and ascent deepens the low (a positive loop)</text>
<line x1="508.1" y1="137.6" x2="615.7" y2="189.4" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="700.0" y1="274.0" x2="700.0" y2="356.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="710.0" y="309.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="580.3" y1="439.9" x2="540.7" y2="453.1" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="550.5" y="440.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="319.3" y1="453.1" x2="279.7" y2="439.9" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="289.5" y="440.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">+</text>
<line x1="160.0" y1="356.0" x2="160.0" y2="274.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="244.3" y1="189.4" x2="351.9" y2="137.6" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="280.0" y="65.0" width="300" height="70" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="430" y="95.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Warm tropical surface</text>
<text x="430" y="115.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(sunlight, warm ocean)</text>
<rect x="555.0" y="192.0" width="290" height="76" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Surface air warms and rises:</text>
<text x="700" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">low pressure near the equator</text>
<rect x="555.0" y="362.0" width="290" height="76" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="395.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Trades blow in from both</text>
<text x="700" y="415.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">hemispheres: convergence</text>
<rect x="280.0" y="455.0" width="300" height="70" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="430" y="485.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Moist air ascends:</text>
<text x="430" y="505.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">deep clouds and heavy rain</text>
<rect x="15.0" y="362.0" width="290" height="76" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="160" y="395.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Condensation releases latent</text>
<text x="160" y="415.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">heat: column warms further</text>
<rect x="15.0" y="192.0" width="290" height="76" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="160" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Upper-level outflow towards</text>
<text x="160" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">both poles: Hadley cells</text>
<text x="430.0" y="572" text-anchor="middle" font-size="13" fill="#52514e">Surface convergence at the equator ⇒ ascent ⇒ upper outflow: the ascending branch of the Hadley circulation (CL11)</text>
</svg>