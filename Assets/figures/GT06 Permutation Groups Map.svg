<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1000" height="630" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">GT06: permutation groups in one page</text>
<line x1="321.0" y1="130.0" x2="349.0" y2="130.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="651.0" y1="130.0" x2="679.0" y2="130.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="192.2" y1="185.6" x2="225.8" y2="269.4" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="421.0" y1="330.0" x2="469.0" y2="330.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="492.6" y1="185.9" x2="457.4" y2="454.1" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="25.0" y="80.0" width="290" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Transitive action</text>
<text x="170" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">|G| = n |G_a|</text>
<text x="170" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">k-transitive: n(n-1)...</text>
<rect x="355.0" y="80.0" width="290" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Blocks</text>
<text x="500" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">primitive &lt;=&gt; G_a maximal</text>
<text x="500" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">2-transitive =&gt; primitive</text>
<rect x="685.0" y="80.0" width="290" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Frobenius groups</text>
<text x="830" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">kernel K of size n (counting lemma)</text>
<text x="830" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">S3, A4, F20, AGL(1,q)</text>
<rect x="85.0" y="275.0" width="330" height="110" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="250" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">S_n and A_n</text>
<text x="250" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">A_n is (n-2)-transitive</text>
<text x="250" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Z(S_n) = 1, n &gt;= 3</text>
<rect x="475.0" y="275.0" width="330" height="110" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="640" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">A_n simple, n &gt;= 5</text>
<text x="640" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">four cases: cycle of length &gt;= 4,</text>
<text x="640" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">two 3-cycles, one 3-cycle, transpositions</text>
<rect x="240.0" y="460.0" width="420" height="100" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="450" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Imprimitive groups embed in wreath products</text>
<text x="450" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">D4 = C2 wr C2; Sylow p of S_(p^2) = Cp wr Cp</text>
<text x="500.0" y="612" text-anchor="middle" font-size="13" fill="#52514e">Kurzweil-Stellmacher ch. 4; own proofs</text>
</svg>