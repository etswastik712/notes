<text x="330" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">NaF, RONa, RNH2, RMgX</text>
<rect x="540.0" y="460.0" width="320" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="495.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">ring opening 210-250 C</text>
<text x="700" y="515.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">[NPCl2]n -&gt; [NPR2]n</text>
<text x="700" y="535.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">polyphosphazenes</text>
<text x="500.0" y="612" text-anchor="middle" font-size="13" fill="#52514e">CH-2113 slides 109-119; Tutorial 4 Q5-Q10</text>
