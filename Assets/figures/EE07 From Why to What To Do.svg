<text x="200" y="240.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">WHO is at risk?</text>
<text x="200" y="260.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">rarity: range x tolerance x</text>
