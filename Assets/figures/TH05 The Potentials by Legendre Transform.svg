<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="940" height="570" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="470.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Each constraint has its own potential: swap a variable for its conjugate</text>
<line x1="311.0" y1="170.0" x2="329.0" y2="170.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="330.0" y="164.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">-Jx</text>
<line x1="170.0" y1="224.0" x2="170.0" y2="316.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="180.0" y="264.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">-TS</text>
<line x1="470.0" y1="224.0" x2="470.0" y2="316.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="480.0" y="264.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">-TS</text>
<line x1="311.0" y1="370.0" x2="329.0" y2="370.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="330.0" y="364.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">-Jx</text>
<line x1="311.0" y1="370.0" x2="664.0" y2="370.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="497.5" y="364.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">-mu N</text>
<line x1="551.9" y1="318.8" x2="708.1" y2="221.2" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="790.0" y1="309.0" x2="790.0" y2="224.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="35.0" y="122.0" width="270" height="96" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="155.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Energy E(S, x, N)</text>
<text x="170" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">dE = T dS + J dx + mu dN</text>
<text x="170" y="195.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">isolated: S is maximal</text>
<rect x="335.0" y="122.0" width="270" height="96" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="470" y="155.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Enthalpy H = E - J x</text>
<text x="470" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">H(S, J, N): dH = T dS - x dJ</text>
<text x="470" y="195.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">const S, J: H is minimal</text>
<rect x="35.0" y="322.0" width="270" height="96" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="355.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Helmholtz F = E - T S</text>
<text x="170" y="375.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">F(T, x, N): dF = -S dT + J dx</text>
<text x="170" y="395.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">const T, no work: F is minimal</text>
<rect x="335.0" y="322.0" width="270" height="96" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="470" y="355.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Gibbs G = E - T S - J x</text>
<text x="470" y="375.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">G(T, J, N): dG = -S dT - x dJ</text>
<text x="470" y="395.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">const T, J: G is minimal</text>
<rect x="670.0" y="315.0" width="240" height="110" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="790" y="345.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Grand potential</text>
<text x="790" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">G-tilde = E - T S - mu N</text>
<text x="790" y="385.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">d = -S dT - J dx - N dmu</text>
<text x="790" y="405.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">const T, mu: minimal</text>
<rect x="670.0" y="122.0" width="240" height="96" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="790" y="155.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Maxwell relations</text>
<text x="790" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">mixed second derivatives</text>
<text x="790" y="195.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">of any potential agree</text>
<text x="470.0" y="552" text-anchor="middle" font-size="13" fill="#52514e">Kardar I.G-I.H (MIT 8.333 Lectures 3): potentials are Legendre transforms; the inequalities of Table 2 pick the equilibrium state</text>
</svg>