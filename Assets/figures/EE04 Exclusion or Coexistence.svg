<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" width="920" height="590" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="920" height="590" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="460.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">When do competitors exclude each other, and when do they coexist?</text>
<line x1="378.3" y1="162.5" x2="269.4" y2="212.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="460.0" y1="166.0" x2="460.0" y2="209.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="541.7" y1="162.5" x2="650.6" y2="212.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="187.8" y1="320.2" x2="217.2" y2="369.8" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="389.6" y1="318.6" x2="320.4" y2="371.4" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="530.4" y1="318.6" x2="599.6" y2="371.4" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="250.0" y="90.0" width="420" height="70" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="460" y="130.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Two species depend on the same limiting resource</text>
<rect x="20.0" y="215.0" width="270" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="155" y="250.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Same niche, one resource:</text>
<text x="155" y="270.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">the lower R* wins</text>
<text x="155" y="290.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(Gause; Tilman)</text>
<rect x="325.0" y="215.0" width="270" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="460" y="250.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Lotka-Volterra: coexist only if</text>
<text x="460" y="270.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">each limits itself more than</text>
<text x="460" y="290.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">the other (a12 a21 &lt; 1)</text>
<rect x="630.0" y="215.0" width="270" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="765" y="250.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Invader with no enemies:</text>
<text x="765" y="270.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">a super-competitor drives</text>
<text x="765" y="290.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">natives out</text>
<rect x="85.0" y="375.0" width="330" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="250" y="410.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Niche partitioning lowers a:</text>
<text x="250" y="430.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">space, time, body size</text>
<text x="250" y="450.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(barnacles, spiny mice, finches)</text>
<rect x="505.0" y="375.0" width="330" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="670" y="410.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Conditional outcomes:</text>
<text x="670" y="430.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">temperature and humidity flip</text>
<text x="670" y="450.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">the winner (Park&#x27;s Tribolium)</text>
<text x="460.0" y="572" text-anchor="middle" font-size="13" fill="#52514e">Slides 7-30: exclusion in 3 of 4 L-V regions, yet in nature similar species often coexist: partitioning and conditions explain how</text>
</svg>