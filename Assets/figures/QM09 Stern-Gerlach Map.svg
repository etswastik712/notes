<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1000" height="670" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="500.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">QM09: the Stern-Gerlach experiment and spin in one page</text>
<line x1="316.0" y1="140.0" x2="349.0" y2="140.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="651.0" y1="140.0" x2="679.0" y2="140.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="408.0" y1="193.0" x2="270.7" y2="272.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="500.0" y1="196.0" x2="500.0" y2="269.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="316.0" y1="330.0" x2="679.0" y2="330.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="475.2" y1="195.5" x2="357.1" y2="459.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="486.0" y1="520.0" x2="529.0" y2="520.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="562.2" y1="389.1" x2="637.8" y2="460.9" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="789.0" y1="390.0" x2="741.0" y2="460.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="30.0" y="90.0" width="280" height="100" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">The experiment</text>
<text x="170" y="135.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Ag beam, inhomogeneous B</text>
<text x="170" y="155.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">F = mu_z dB_z/dz: two spots,</text>
<text x="170" y="175.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">not a smear</text>
<rect x="355.0" y="90.0" width="290" height="100" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="125.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Spin-1/2</text>
<text x="500" y="145.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">S = (hbar/2) sigma, [Si,Sj] = i hbar eps Sk</text>
<text x="500" y="165.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">state space C^2, Bloch sphere</text>
<rect x="685.0" y="90.0" width="290" height="100" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="125.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Sequential SG</text>
<text x="830" y="145.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">P(+n&#x27;|+n) = (1 + n.n&#x27;)/2</text>
<text x="830" y="165.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">z-x-z: 1/8, sin^2(theta)/4</text>
<rect x="30.0" y="275.0" width="280" height="110" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Density matrix</text>
<text x="170" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">rho = (1 + r.sigma)/2</text>
<text x="170" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">oven beam = I/2, entropy ln 2</text>
<rect x="355.0" y="275.0" width="290" height="110" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="500" y="305.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Dynamics</text>
<text x="500" y="325.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Larmor omega = |gamma| B,</text>
<text x="500" y="345.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">U = exp(-i th n.sigma/2), 4 pi,</text>
<text x="500" y="365.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Rabi P = Om^2/(Om^2+D^2) sin^2</text>
<rect x="685.0" y="275.0" width="290" height="110" rx="12" fill="#f8d9d9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="830" y="315.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">SG as a measurement</text>
<text x="830" y="335.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">spin entangled with position</text>
<text x="830" y="355.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">packet overlap exp(-dp^2/2 sp^2)</text>
<rect x="180.0" y="465.0" width="300" height="110" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="330" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Beyond 1/2</text>
<text x="330" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">j = 0, 1/2, 1, ...: 2j+1 beams</text>
<text x="330" y="545.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">Schwinger oscillators, 1/2 x 1/2 = 0 + 1</text>
<rect x="535.0" y="465.0" width="330" height="110" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="700" y="505.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Entanglement and parallels</text>
<text x="700" y="525.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">singlet E = -cos, CHSH 2 sqrt 2, BB84</text>
<text x="700" y="545.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">polarisers, NMR, flavour oscillation</text>
<text x="500.0" y="652" text-anchor="middle" font-size="13" fill="#52514e">Sakurai 1.1, 3.2, 3.10, 5.5; Griffiths 4.4; every number in scripts/qm09_numbers.py</text>
</svg>