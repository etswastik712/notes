<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="760" height="550" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="380.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">Leaky greenhouse: three balances</text>
<line x1="575.1" y1="316.2" x2="435.5" y2="404.8" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<line x1="330.5" y1="404.5" x2="221.8" y2="326.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="266.2" y="359.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">absorbed εσT_s⁴</text>
<line x1="221.8" y1="223.5" x2="330.5" y2="145.5" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="286.2" y="178.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">εσT_a⁴</text>
<line x1="380.0" y1="402.0" x2="380.0" y2="148.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="390.0" y="269.0" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">leaks (1−ε)σT_s⁴</text>
<rect x="265.0" y="78.0" width="230" height="64" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="115.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Space</text>
<rect x="25.0" y="227.0" width="250" height="96" rx="12" fill="#d3f1e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="150" y="260.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Atmospheric layer</text>
<text x="150" y="280.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T_a, absorptivity ε</text>
<text x="150" y="300.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">emits ε σT_a⁴ up and down</text>
<rect x="260.0" y="408.0" width="240" height="64" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="435.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Surface  T_s</text>
<text x="380" y="455.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">emits σT_s⁴</text>
<rect x="545.0" y="237.0" width="190" height="76" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="640" y="270.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Absorbed sunlight</text>
<text x="640" y="290.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">(1−α)S/4 = 238 W/m²</text>
<text x="380.0" y="532" text-anchor="middle" font-size="13" fill="#52514e">TOA: Q = εσT_a⁴ + (1−ε)σT_s⁴;  surface: Q + εσT_a⁴ = σT_s⁴;  layer: 2εσT_a⁴ = εσT_s⁴</text>
</svg>