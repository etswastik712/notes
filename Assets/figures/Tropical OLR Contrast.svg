<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="760" height="540" rx="10" fill="#fcfcfb"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#eb6834"/></marker></defs>
<text x="380.0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#0b0b0b">OLR contrast: the colder the emitter, the dimmer the planet</text>
<line x1="200.9" y1="330.3" x2="354.5" y2="132.7" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="287.7" y="225.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">459 W/m²</text>
<line x1="528.4" y1="191.8" x2="430.3" y2="131.2" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="469.3" y="155.5" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">133</text>
<line x1="590.0" y1="359.0" x2="590.0" y2="271.0" stroke="#eb6834" stroke-width="2.6" marker-end="url(#ah)"/>
<rect x="60.0" y="72.0" width="640" height="56" rx="12" fill="#eeeeea" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="380" y="95.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Space: what a satellite sees</text>
<text x="380" y="115.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">OLR = outgoing longwave radiation</text>
<rect x="45.0" y="335.0" width="250" height="70" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="170" y="365.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Clear, dry region (desert)</text>
<text x="170" y="385.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">ground T_s ≈ 300 K: σT_s⁴ = 459</text>
<rect x="455.0" y="195.0" width="270" height="70" rx="12" fill="#dbe8f9" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="590" y="225.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Deep convective cloud top</text>
<text x="590" y="245.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T_c ≈ 220 K: σT_c⁴ = 133 W/m²</text>
<rect x="455.0" y="365.0" width="270" height="70" rx="12" fill="#fbe0d4" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="590" y="395.0" text-anchor="middle" font-size="15" fill="#0b0b0b" font-weight="600">Warm moist ground below</text>
<text x="590" y="415.0" text-anchor="middle" font-size="14" fill="#0b0b0b" font-weight="400">T_s ≈ 300 K (hidden)</text>
<text x="380.0" y="522" text-anchor="middle" font-size="13" fill="#52514e">(300/220)⁴ ≈ 3.5: deep convection = LOW OLR, clear dry air = HIGH OLR</text>
</svg>