 for(const [z0,sg] of Ls){for(const sx of [-1,1]){P1.dot(sx,z0,sg>0?(sx>0?C.red:C.orange):(sx>0?C.orange:C.red),4.5)}}
 // axis plot
 const zs=M.linspace(-3,3,300),bz=zs.map(z=>{let b=0;for(const [z0,s] of Ls)b+=loopB(0,z,z0,s)[1];return b*2});// units mu0 I/(2a)
 const mx=Math.max(1.2,...bz);const mn=Math.min(0,...bz);P2.set({xmin:-3,xmax:3,ymin:mn-0.1,ymax:mx*1.08});P2.clear();P2.hline(0,'#999');P2.line(zs,bz,C.blue,2.5);

 const B0=bz[150];let d2=NaN;{const h=0.02,f=z=>{let b=0;for(const [z0,s] of Ls)b+=loopB(0,z,z0,s)[1];return b*2};d2=(f(h)-2*f(0)+f(-h))/(h*h)}
