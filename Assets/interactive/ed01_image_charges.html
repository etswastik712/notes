function draw(){const s=sc.value,d=sd.value,e=se.value,C0=charges();const Z0=s==='s'?-3:-1.6,Z1=s==='s'?3.4:4;P1.set({xmin:-3,xmax:3,ymin:Z0,ymax:Z1});P1.clear();
 if(s==='p')P1.area([-3,3],[0,0],[-1.6,-1.6],'rgba(120,120,120,0.35)');else if(s==='d')P1.area([-3,3],[0,0],[-1.6,-1.6],'rgba(80,140,220,0.18)');else{const pts=M.linspace(0,2*Math.PI,100).map(t=>[Math.cos(t),Math.sin(t)]);P1.poly(pts,'rgba(120,120,120,0.45)','#666',1.5)}
 const N=26;for(let i=0;i<N;i++){const t=2*Math.PI*(i+0.5)/N,x0=0.06*Math.cos(t),z0=d+0.06*Math.sin(t);const pts=trace(x0,z0,C0,1);P1.line(pts.map(p=>p[0]),pts.map(p=>p[1]),C.blue,1.3)}
 P1.dot(0,d,C.red,7);P1.text('q',0.12,d+0.12,C.red);for(const [q,xi,zi] of C0.img){P1.dot(xi,zi,C.orange,5);P1.text('image q′ = '+M.fmt(q,3),xi+0.15,zi-0.1,C.orange)}
 P2.clear();let tot,F,desc;
 if(s==='p'){P2.set({xmin:-3,xmax:3,ymin:-0.5,ymax:0.05,xlabel:'ρ (distance from the axis)',ylabel:'σ (q/d² units × 1)'});P2.clear();const xs=M.linspace(-3,3,300);P2.line(xs,xs.map(r=>-d/(2*Math.PI*Math.pow(r*r+d*d,1.5))),C.orange,2.5);tot=-1;F=-1/((2*d)**2);desc='σ(ρ) = −q d / (2π (ρ² + d²)^{3/2}); plane: image at −d'}
 else if(s==='s'){const y=d,qi=-1/y,yi=1/y;const th=M.linspace(0,Math.PI,200);const sg=th.map(t=>{const x=Math.sin(t),z=Math.cos(t);const a=pt(1,0,y,x,z),b=pt(qi,0,yi,x,z);return((a[0]+b[0])*x+(a[1]+b[1])*z)/(4*Math.PI)});P2.set({xmin:0,xmax:180,ymin:Math.min(...sg)*1.08,ymax:0.05*Math.abs(Math.min(...sg)),xlabel:'polar angle θ on the sphere (degrees, 0 = nearest the charge)',ylabel:'σ'});P2.clear();P2.line(th.map(t=>t*180/Math.PI),sg,C.orange,2.5);tot=qi;F=qi/((y-yi)**2);desc='σ = ε₀E_r at the surface; q′ = −a q/y at a²/y = '+M.fmt(yi,3)}
 else{const chi=e-1,sb=r=>-(1/(2*Math.PI))*chi/(chi+2)*d/Math.pow(r*r+d*d,1.5);P2.set({xmin:-3,xmax:3,ymin:-0.5,ymax:0.05,xlabel:'ρ (distance from the axis)',ylabel:'σ_b'});P2.clear();const xs=M.linspace(-3,3,300);P2.line(xs,xs.map(sb),C.orange,2.5);tot=-chi/(chi+2);F=tot/((2*d)**2);desc='bound surface charge σ_b = −(1/2π) χe/(χe+2) · q d/(ρ² + d²)^{3/2}; field below = that of q″ = '+M.fmt(C0.qpp,3)+' q in a medium εr'}
 out.textContent=`${desc}\ntotal induced (bound) charge = ${M.fmt(tot,4)} q ;   force on q (toward + z is repulsive): F = ${M.fmt(F,4)} q²/(4πε₀) per length² (negative = attraction)`}
draw();
ui.note('ED01 / G §3.2 (3.9)–(3.12), §4.4 Ex. 4.8 (4.50)–(4.54); J §2.1–2.2 (2.4), §4.4 (4.41)–(4.47). The sphere is grounded and neutral otherwise; the field outside is q + q′ by the uniqueness theorem (G §3.1.5, J §1.9).');
