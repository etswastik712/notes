function draw(){const zm=traitM();let mu=0;for(const x of zm)mu+=x;mu/=N;hist(H1,b,0,Math.sqrt(V0b),'rgba(214,69,61,0.7)');hist(H2,zm,mu,Math.sqrt(V0m),'rgba(42,120,214,0.7)');
 V.set({xmax:Math.max(20,gen+1)});V.clear();const lg=a=>a.map(p=>Math.log10(Math.max(p[1],1e-7)));V.line(vb.map(p=>p[0]),lg(vb),C.red,2.2);V.line(vm.map(p=>p[0]),lg(vm),C.blue,2.2);V.fn(t=>t*Math.log10(0.5),C.muted,1.2,[5,4]);V.legend([['blending',C.red],['Mendelian',C.blue],['theory 0.5^t',C.muted,[5,4]]],70,40);
 const lb=vb[vb.length-1][1],lm=vm[vm.length-1][1];out.textContent=`generation ${gen}: blending variance = ${M.fmt(lb,3)} of the start (theory 0.5^${gen} = ${M.fmt(Math.pow(0.5,gen),3)}); Mendelian variance = ${M.fmt(lm,3)} of the start (N = ${N}, L = ${L} loci; drift alone removes about 1/(2N) = ${M.fmt(1/(2*N),2)} of it per generation).`}
reset();ui.note('EE08 §5.1: Var of the mid-parent value = (V + V)/4 = V/2 under random mating, so blending halves heritable variation each generation (Jenkin 1867; Templeton 2006 p. 34). Under particulate inheritance the allele frequencies, and the variance they generate, are unchanged by mating (Hardy–Weinberg), apart from drift ~1/(2N) per generation. Histograms are scaled by the initial standard deviation.');
