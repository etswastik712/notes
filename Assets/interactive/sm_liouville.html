 const Ab=area(bnd);const Cg=cells();out.textContent=`t = ${M.fmt(t,3)}   boundary (fine-grained) area = ${M.fmt(Ab,5)}   initial ${M.fmt(A0,5)}   ratio ${M.fmt(Ab/A0,5)}${sg.value>0?'   (friction: expected e^{−γt} = '+M.fmt(Math.exp(-sg.value*t),4)+')':'   → conserved (Liouville)'}\ncoarse-grained area (occupied 0.15×0.15 cells, 3000 points) = ${M.fmt(Cg,4)} ${Cg>C0*1.15?'→ grows as the filament spreads: the origin of entropy increase':''}\ncoarse-grained area now / at t = 0: ${M.fmt(Cg/C0,3)}   (fine-grained: ${M.fmt(Ab/A0,4)})`}
loop((dt)=>{const h=0.01,n=Math.ceil(dt*1.6/h);for(let s=0;s<n;s++){bnd=bnd.map(y=>M.rk4(f,y,t,h));pts=pts.map(y=>M.rk4(f,y,t,h));t+=h}draw()});draw();
ui.note('SM02/CM09: ∂ρ/∂t + {ρ, H} = 0; the flow of Hamilton\'s equations has unit Jacobian (∂q̇/∂q + ∂ṗ/∂p = 0). Boundary of 600 points integrated with RK4 (dt = 0.01); the shoelace area is conserved to ~10⁻⁶. With friction ∇·(q̇, ṗ) = −γ so area ∝ e^{−γt}.');
