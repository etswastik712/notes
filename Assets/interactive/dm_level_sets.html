function draw(){const k=fs.value,{f,g,crit}=F[k],c=sc.value;P.clear();
 // background shading by sign
 const G=P.g,N=60,xs=M.linspace(-3,3,N),ys=M.linspace(-2.5,2.5,N);const cw=(P.X(3)-P.X(-3))/N,ch=(P.Y(-2.5)-P.Y(2.5))/N;for(let i=0;i<N;i++)for(let j=0;j<N;j++){G.fillStyle=f(xs[i],ys[j])>c?'rgba(235,104,52,0.07)':'rgba(42,120,214,0.07)';G.fillRect(P.X(xs[i])-cw/2,P.Y(ys[j])-ch/2,cw+0.6,ch+0.6)}
 segs(f,c).forEach(s=>P.line([s[0][0],s[1][0]],[s[0][1],s[1][1]],C.blue,3));
 crit.forEach(([x,y])=>{const v=f(x,y);const onLevel=Math.abs(v-c)<0.03;P.dot(x,y,onLevel?C.red:C.muted,onLevel?9:5);P.text('f='+M.fmt(v,3),x+0.08,y+0.15,onLevel?C.red:C.muted)});
 // gradient arrows at a few points on the level set
 const sg=segs(f,c);for(let i=0;i<sg.length;i+=Math.max(1,Math.floor(sg.length/12))){const [x,y]=sg[i][0],gr=g(x,y),n=Math.hypot(...gr);if(n>1e-6)P.arrow(x,y,x+0.35*gr[0]/n,y+0.35*gr[1]/n,C.red,1.8,6)}
 const critVals=crit.map(([x,y])=>f(x,y));const isReg=!critVals.some(v=>Math.abs(v-c)<0.02);
 // components by union-find on segment endpoints
 const key=p=>Math.round(p[0]*60)+','+Math.round(p[1]*60);const par=new Map();const find=a=>{while(par.get(a)!==a){par.set(a,par.get(par.get(a)));a=par.get(a)}return a};sg.forEach(s=>{const a=key(s[0]),b=key(s[1]);if(!par.has(a))par.set(a,a);if(!par.has(b))par.set(b,b);par.set(find(a),find(b))});const roots=new Set([...par.keys()].map(find));
 out.textContent=`level c = ${M.fmt(c,3)}: ${isReg?'REGULAR value (∇f ≠ 0 on f = c) → f⁻¹(c) is an embedded 1-dimensional submanifold':'CRITICAL value (∇f = 0 at a point of the level set) → the level set may not be a manifold there'}\ncritical points at ${crit.map(([x,y])=>'('+M.fmt(x,3)+', '+M.fmt(y,3)+')').join(', ')} with critical values ${[...new Set(critVals.map(v=>M.fmt(v,3)))].join(', ')}   visible contour components ≈ ${roots.size}   (red arrows: ∇f, perpendicular to the level set)`}
setup();ui.note('DM06/DM07: regular level set theorem: if c is a regular value of a smooth f: M → N then f⁻¹(c) is a properly embedded submanifold of codimension dim N; Sard: almost every c is regular. Contours by marching squares on a 140×140 grid; critical values are listed exactly from the critical points of each f.');

})();
