 const edge=(a,b)=>M.linspace(0,1,60).map(t=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);let bd=[];for(let i=0;i<4;i++)bd=bd.concat(edge(sq[i],sq[(i+1)%4]));const imb=bd.map(p=>f(p[0],p[1]));P2.poly(imb,'rgba(235,104,52,0.25)',C.orange,2.5);const fp=f(x0,y0);P2.dot(fp[0],fp[1],C.red,6);
 // linearisation parallelogram
 const J=Jf(f,x0,y0);const lin=[[-1,-1],[1,-1],[1,1],[-1,1]].map(s=>[fp[0]+J[0][0]*s[0]*rho+J[0][1]*s[1]*rho,fp[1]+J[1][0]*s[0]*rho+J[1][1]*s[1]*rho]);P2.poly(lin,null,C.blue,2.5);
 P2.legend([['image of the neighbourhood',C.orange],['linearisation F(p) + J·h',C.blue]],P2.o.ml+8,P2.o.mt+14);
 const d=det(J);out.textContent=`p = (${x0}, ${y0}), F(p) = (${M.fmt(fp[0],4)}, ${M.fmt(fp[1],4)})   J = DF(p) = [[${M.fmt(J[0][0],3)}, ${M.fmt(J[0][1],3)}], [${M.fmt(J[1][0],3)}, ${M.fmt(J[1][1],3)}]]   det J = ${M.fmt(d,4)}\n${Math.abs(d)>1e-3?`det J ≠ 0 → F is a local diffeomorphism near p (inverse function theorem); local inverse has derivative J⁻¹ = [[${M.fmt(J[1][1]/d,3)}, ${M.fmt(-J[0][1]/d,3)}], [${M.fmt(-J[1][0]/d,3)}, ${M.fmt(J[0][0]/d,3)}]]`:'det J ≈ 0 → the theorem does not apply: F is not locally invertible here (fold / collapse)'}\n${mp.value==='sq'?'z ↦ z² has det J = 4(x²+y²) > 0 away from 0 but is 2-to-1: local, not global, invertibility.':mp.value==='fold'?'det J = 2y: sign change across y = 0 (blue ↔ red) where the map folds.':mp.value==='pol'?'det J = r: the polar coordinate map is singular at r = 0.':'det J = 1 − ¼ cos x cos y > 0 everywhere and F is a bijection (a global diffeomorphism).'}`}
draw();ui.note('PA13: if F is C¹ and DF(p) is invertible then F is a diffeomorphism from a neighbourhood of p onto a neighbourhood of F(p), with D(F⁻¹)(F(p)) = DF(p)⁻¹. DM03/DM05 use the same statement for maps between manifolds (rank theorem).');
