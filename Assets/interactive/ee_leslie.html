(function(){
const META={"title": "Age-structured growth: the Leslie matrix settles into a stable age distribution", "desc": "Four age classes with fecundities F and survivals P: n_{t+1} = L n_t. Start from any age mix and watch the oscillations die away: the total grows like \u03bb\u1d57 and the proportions in each class converge to the same stable age distribution, the dominant eigenvector. The Euler\u2013Lotka equation \u03a3 F_x l_x \u03bb^{\u2212x} = 1 gives \u03bb, and \u03bb > 1 exactly when the net reproductive rate R\u2080 > 1.", "vault": "EE", "chapters": ["EE02 Structured Population Models"], "tryit": "Defaults P = (0.5, 0.2, 0.1), F = (0, 2, 1, 1) and 200 newborns reproduce the slide: \u03bb = 1.05082, SAD (0.635, 0.302, 0.057, 0.005). Lower F\u2082 until R\u2080 < 1 and the population dies out. Start with all adults instead of newborns to change the transient, not the limit.", "id": "ee_leslie"};ui.init(META.title,META.desc);
ui.gridOf(2);const P1=ui.canvas(260,{xmin:0,xmax:60,ymin:0,ymax:1,xlabel:'time step t',ylabel:'proportion in each age class',title:'age shares → stable age distribution'});const P2=ui.canvas(260,{xmin:0,xmax:60,ymin:0.3,ymax:2.7,xlabel:'time step t',ylabel:'N_{t+1}/N_t',title:'growth ratio → λ'});

const out=ui.readout();
function L(){const F=sF.map(s=>s.value),P=sPs.map(s=>s.value);return[F,[P[0],0,0,0],[0,P[1],0,0],[0,0,P[2],0]]}

 out.textContent=`R₀ = Σ F_x l_x = ${M.fmt(R0,5)}   Euler–Lotka λ = ${isNaN(lam)?'—':M.fmt(lam,6)}   (λ > 1 ⇔ R₀ > 1: ${R0>1?'growing':'declining'}; r = ln λ = ${M.fmt(Math.log(lam),4)})\nstable age distribution (eigenvector) = (${w.map(v=>M.fmt(v,4)).join(', ')})   current shares at t = ${T-1}: (${cur.map(v=>M.fmt(v,4)).join(', ')})   N_{60}/N_{59} = ${M.fmt(ratio[ratio.length-1],6)}`}
