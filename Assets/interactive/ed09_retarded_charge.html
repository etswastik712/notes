 const ra=r[0]*T.a[0]+r[1]*T.a[1];const Ev=[rm/(ru**3)*(1-v2)*u[0],rm/(ru**3)*(1-v2)*u[1]];const Ea=[rm/(ru**3)*(u[0]*ra-T.a[0]*ru),rm/(ru**3)*(u[1]*ra-T.a[1]*ru)];return{tr,T,rm,n,Ev,Ea,E:[Ev[0]+Ea[0],Ev[1]+Ea[1]],ru}}
function draw(){const t=st.value;P1.clear();P1.set({xmin:-6+(md.value==='u'?sb.value*t*0.5:0),xmax:6+(md.value==='u'?sb.value*t*0.5:0)});P1.clear();const xc=md.value==='u'?sb.value*t*0.5:0;
 // trajectory
 const ts=M.linspace(Math.max(0,t-12),t,200).map(x=>traj(x).w);P1.line(ts.map(a=>a[0]),ts.map(a=>a[1]),C.grid,2);
 // field arrows
 const nx=17,ny=17;for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const x=-6+xc+12*(i+0.5)/nx,y=-6+12*(j+0.5)/ny;const w=traj(t).w;if(Math.hypot(x-w[0],y-w[1])<0.5)continue;const F=field([x,y],t),m=Math.hypot(...F.E);if(!isFinite(m)||m===0)continue;const L=0.55;P1.arrow(x-L*F.E[0]/m*0.5,y-L*F.E[1]/m*0.5,x+L*F.E[0]/m*0.5,y+L*F.E[1]/m*0.5,'rgba(120,120,120,0.55)',1.3,4)}
 const F=field(obs,t),Tp=traj(t).w,Tr=F.T.w;P1.line([obs[0],Tr[0]],[obs[1],Tr[1]],C.orange,1.6,[4,3]);P1.dot(Tr[0],Tr[1],C.orange,8);P1.text('retarded',Tr[0]+0.15,Tr[1]+0.2,C.orange);P1.dot(Tp[0],Tp[1],C.blue,8);P1.text('present',Tp[0]+0.15,Tp[1]-0.3,C.blue);P1.dot(obs[0],obs[1],C.red,7);const m=Math.hypot(...F.E);P1.arrow(obs[0],obs[1],obs[0]+1.2*F.E[0]/m,obs[1]+1.2*F.E[1]/m,C.red,3,9);
 // P2: field magnitudes along the line from the retarded position through the observer, same retarded time
 P2.clear();const rs=M.linspace(0.05,3,60),Ev=[],Ea=[];const tr=F.tr,T=F.T,nn=F.n;rs.forEach(lr=>{const r=Math.pow(10,lr),rv=[r*nn[0],r*nn[1]],u=[nn[0]-T.v[0],nn[1]-T.v[1]],ru=r*(nn[0]*u[0]+nn[1]*u[1]),v2=T.v[0]**2+T.v[1]**2,ra=r*(nn[0]*T.a[0]+nn[1]*T.a[1]);const ev=[r/(ru**3)*(1-v2)*u[0],r/(ru**3)*(1-v2)*u[1]],ea=[r/(ru**3)*(u[0]*ra-T.a[0]*ru),r/(ru**3)*(u[1]*ra-T.a[1]*ru)];Ev.push(Math.log10(Math.hypot(...ev)+1e-30));Ea.push(Math.log10(Math.hypot(...ea)+1e-30))});
 P2.set({ymin:Math.min(...Ev,...Ea.filter(v=>v>-29))-0.3,ymax:Math.max(...Ev,...Ea)+0.3});P2.clear();P2.line(rs,Ev,C.blue,2.6);P2.line(rs,Ea.map(v=>v<-29?NaN:v),C.orange,2.6);P2.vline(Math.log10(F.rm),C.red,[3,3]);P2.legend([['velocity field ∝ r⁻²',C.blue],['acceleration field ∝ r⁻¹',C.orange],['your observer',C.red,[3,3]]],P2.o.ml+8,P2.o.mt+14);
 const bb=Math.hypot(...F.T.v),cosang=(F.n[0]*F.T.v[0]+F.n[1]*F.T.v[1])/Math.max(bb,1e-9);const Rp=[obs[0]-Tp[0],obs[1]-Tp[1]];
 out.textContent=`observer at (${M.fmt(obs[0],3)}, ${M.fmt(obs[1],3)}), t = ${t}: retarded time t_r = ${M.fmt(F.tr,5)} (light travel time t − t_r = ${M.fmt(t-F.tr,4)} = r/c with r = ${M.fmt(F.rm,4)}); 1 − n̂·β = ${M.fmt(F.ru/F.rm,4)}\n|E| = ${M.fmt(m,4)} (velocity part ${M.fmt(Math.hypot(...F.Ev),4)}, acceleration part ${M.fmt(Math.hypot(...F.Ea),4)}) in units q/4πε₀ with c = 1.${md.value==='u'?'   E parallel to R from the PRESENT position: angle between E and R = '+M.fmt(Math.abs(Math.atan2(F.E[0]*Rp[1]-F.E[1]*Rp[0],F.E[0]*Rp[0]+F.E[1]*Rp[1]))*180/Math.PI,2)+'° (≈ 0)':'   B = n̂ × E / c: |B| = |E|/c (c = 1)'}`}
draw();ui.note('ED09 / G §10.3, J §14.1: potentials V = qc/4πε₀(rc − r·v), A = (v/c²)V at the retarded time (10.46–10.47); E = (q/4πε₀) r/(r·u)³[(c²−v²)u + r×(u×a)], u = c r̂ − v (10.72); B = r̂×E/c (10.73). Planar case: r×(u×a) = u(r·a) − a(r·u). Verified against −∇V − ∂A/∂t and ∇×A to 10⁻¹² (scripts/ed09_numbers.py). Jackson (14.14) is the same in Gaussian units (e ↔ q/4πε₀, B = n×E).');
