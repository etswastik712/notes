.note{color:var(--muted);font-size:12px;margin-top:6px}
.err{background:#fde;color:#900;padding:8px;border:1px solid #c00;border-radius:6px;margin:8px 0;font:12px monospace;white-space:pre-wrap}

function turning(){const xs=M.linspace(0.01,Math.PI-0.01,3000);const r=[];let prev=Ueff(xs[0])-Ep;for(let i=1;i<xs.length;i++){const c=Ueff(xs[i])-Ep;if(prev*c<0){let lo=xs[i-1],hi=xs[i];for(let k=0;k<50;k++){const m=(lo+hi)/2;if((Ueff(lo)-Ep)*(Ueff(m)-Ep)<=0)hi=m;else lo=m}r.push((lo+hi)/2)}prev=c}return r}
function draw(){const th0=st.value*Math.PI/180,xs=M.linspace(0.04,Math.PI-0.04,400);const us=xs.map(Ueff);P1.set({ymin:Math.min(...us,Ep)-0.3,ymax:Math.min(Math.max(Ep+4,Ep*1.3+1),Math.max(...us.slice(20,380)))});P1.clear();P1.line(xs,us,C.blue,3);P1.hline(Ep,C.red,[5,3]);const tp=turning();tp.forEach(x=>P1.dot(x,Ep,C.red,6));P1.dot(th,Ueff(th)+0*0,C.orange,7);
 P2.clear();const rmax=Math.max(1,...path.map(p=>Math.hypot(p[0],p[1])),th0)*1.15;P2.set({xmin:-rmax,xmax:rmax,ymin:-rmax,ymax:rmax});P2.clear();P2.line(path.map(p=>p[0]),path.map(p=>p[1]),C.blue,1.6);P2.dot(th*Math.cos(ph),th*Math.sin(ph),C.orange,6);P2.dot(0,0,C.ink,3);
 const M3=sM3.value;const phmin=(()=>{const a=tp.length?Math.min(...tp):th0,b=tp.length?Math.max(...tp):th0;let lo=1e9,hi=-1e9;for(let i=0;i<=40;i++){const x=a+(b-a)*i/40;const v=(Mz-M3*Math.cos(x))/(I1p*Math.sin(x)**2);lo=Math.min(lo,v);hi=Math.max(hi,v)}return[lo,hi]})();
 const kind=phmin[0]*phmin[1]<0?'φ̇ changes sign: LOOPS':Math.abs(sp.value)<1e-9&&true?'φ̇₀ = 0: CUSPS':'φ̇ keeps one sign: smooth precession with nutation';
 out.textContent=`M_z = ${M.fmt(Mz,4)}   E′ = ${M.fmt(Ep,4)}   turning angles θ₁, θ₂ = ${tp.map(x=>M.fmt(x*180/Math.PI,4)+'°').join(', ')}   precession rate φ̇ ∈ [${M.fmt(phmin[0],3)}, ${M.fmt(phmin[1],3)}] → ${kind}\nfast-top estimates (valid when M₃²≫ I′₁μgl): precession ≈ μgl/M = ${M.fmt(mgl/M3,4)}, nutation frequency M/I′₁ ≈ ${M.fmt(M3/I1p,4)} (period ${M.fmt(2*Math.PI*I1p/M3,4)})   sleeping-top stability needs M₃² > 4I′₁μgl = ${M.fmt(4*I1p*mgl,3)} → M₃ ${M3>2?'>':'<'} 2: ${M3>2?'stable if started vertical':'unstable (falls)'}`}
function adv(T){const h=0.002,n=Math.ceil(T/h);let y=[th,thd,ph];for(let i=0;i<n;i++){y=rk(y,h);tt+=h;if(i%10===0)path.push([y[0]*Math.cos(y[2]),y[0]*Math.sin(y[2])])}[th,thd,ph]=y;if(path.length>6000)path.splice(0,path.length-6000)}
